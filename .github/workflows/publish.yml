name: "Build & Publish (podman)"

on:
  push:
    branches: [master]
    # Tags are deliberately NOT matched here. release-please does not create a
    # git tag as a separate "create" event: it creates the GitHub release and
    # the tag atomically, which surfaces to Actions as a `release` event. The
    # repo's event stream confirms it -- `gh api repos/.../events` shows a
    # ReleaseEvent for v0.1.0 and no CreateEvent for any tag. So `tags: ["v*"]`
    # below never fires and only ever produced sha-*/main images.
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish an existing git tag as :<tag> and :latest (backfill)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/invoice-ninja-mcp

# cancel-in-progress is deliberately false on tag pushes: a release tag push
# and the same-commit master push arrive together, and cancelling a GHCR push
# mid-flight can leave a tag pointing at a half-pushed manifest. Two pushes of
# identical content are idempotent; a torn one is not.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      # Single source of truth for tags: consumed by build and push alike, so
      # the two steps can never drift.
      tags: ${{ steps.tags.outputs.list }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Build the app (tsc -> dist/)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # podman, not docker/build-push-action. The repo builds and pushes with
      # podman so the local and CI code paths are the same command.
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          printf '%s' "${GITHUB_TOKEN}" \
            | podman login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}

      - name: Compute tags
        id: tags
        run: |
          # Print the v* tag pointing at a commit, polling because release-please
          # creates the tag moments after the merge push that triggered this run.
          # ls-remote queries the remote directly, so no tag fetch is needed.
          poll_for_release_tag() {
            local sha="$1" attempts="$2" delay="$3" i tag
            for ((i = 1; i <= attempts; i++)); do
              tag=$(git ls-remote --tags origin 'refs/tags/v*' 2>/dev/null \
                | awk -v s="$sha" '$1 == s { sub("refs/tags/", "", $2); print $2; exit }')
              if [[ -n "$tag" ]]; then
                echo "$tag"
                return 0
              fi
              sleep "$delay"
            done
            return 1
          }

          IMAGE="$REGISTRY/$IMAGE_NAME"
          # The immutable per-commit tag is always produced, for every event.
          list="$IMAGE:sha-$(git rev-parse --short HEAD)"

          # Resolve which release version (if any) this run represents.
          # GITHUB_REF is refs/tags/... only for push events that matched the
          # tags filter, which never happens for release-please (see the `on:`
          # block). For a `release` event the version comes from the event
          # payload; for workflow_dispatch it comes from the optional input.
          VERSION=""
          case "$EVENT_NAME" in
            release)
              VERSION="${GITHUB_REF#refs/tags/}"
              ;;
            workflow_dispatch)
              VERSION="$DISPATCH_TAG"
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                VERSION="${GITHUB_REF#refs/tags/}"
              elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
                # A release PR merge reaches us as a plain push, and the `on:
                # release` trigger will NOT fire for it: release-please creates
                # the release using GITHUB_TOKEN, and GitHub suppresses workflow
                # runs for events caused by that token. Verified -- v0.1.1 was
                # published with no release-event run queued.
                #
                # So detect the release tag ourselves. release-please tags the
                # merge commit itself (v0.1.1 -> 9ebacaf, the PR #3 merge), and
                # the tag appears seconds after the push that woke us, hence the
                # bounded poll. No tag within the window means this is an ordinary
                # push and :main is the right tag.
                # Check once first so an ordinary push pays no delay at all.
                VERSION=$(poll_for_release_tag "$GITHUB_SHA" 1 0) || true
                if [[ -z "$VERSION" ]]; then
                  # Only a release-please merge can still gain a tag, so poll
                  # just for those. Otherwise every push to master would idle
                  # for the whole window waiting for a tag that never comes.
                  subject=$(git log -1 --format=%s "$GITHUB_SHA")
                  if [[ "$subject" == *release-please* || "$subject" == chore*master*release* ]]; then
                    echo "release-please merge detected, polling for its tag..."
                    VERSION=$(poll_for_release_tag "$GITHUB_SHA" 12 10) || true
                  fi
                fi
                if [[ -z "$VERSION" ]]; then
                  echo "no release tag on $GITHUB_SHA; treating as a plain push"
                fi
              fi
              ;;
          esac

          # :main tracks the default branch head, including on a release merge
          # (the merge commit IS the branch head), so it is decided separately
          # from the version tags rather than as an either/or.
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/master ]]; then
            list="$list $IMAGE:main"
          fi

          if [[ -n "$VERSION" ]]; then
            # Push BOTH forms: the git tag form (v0.1.1) so the image tag matches
            # the release and a Deployment can pin exactly what the release page
            # shows, and the bare number (0.1.1) so it matches package.json's
            # version field, the Semver source of truth in the repo.
            list="$list $IMAGE:$VERSION $IMAGE:${VERSION#v} $IMAGE:latest"
          fi

          # Deduplicate while preserving order (v0.1.0 yields duplicate-free
          # output already, but keep it explicit so a malformed tag cannot push
          # the same ref twice in one run).
          list=$(printf '%s\n' $list | awk '!seen[$0]++' | paste -sd" " -)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "publishing: $list"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}

      - name: Build image (amd64 — every cluster node is x86_64)
        # --platform only. podman rejects --arch together with --platform
        # ("invalid --platform may not be used with --os, --arch, or --variant").
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          podman build --platform linux/amd64 -f Containerfile "${args[@]}" .
        env:
          TAGS: ${{ steps.tags.outputs.list }}

      # Proves the published artifact actually serves MCP and that the write
      # guard is armed, using only the image that would be pushed.
      - name: Smoke test the image
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          # Reference the first tag CI just produced; this is the same image id
          # every later tag points at, so it is the artifact being published.
          FIRST_TAG=$(echo "$TAGS" | awk '{print $1}')
          podman run -d --name smoke -p 18800:8000 \
            -e INVOICE_NINJA_URL=https://example.invalid \
            -e INVOICE_NINJA_API_TOKEN=smoke \
            "$FIRST_TAG"

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18800/healthz; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "healthz never came up"; podman logs smoke; exit 1; }

          SID=$(curl -fsS -D - -o /dev/null -X POST http://127.0.0.1:18800/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | tr -d '\r' | awk 'tolower($1)=="mcp-session-id:"{print $2}')
          [ -n "$SID" ] || { echo "no mcp-session-id header"; podman logs smoke; exit 1; }

          curl -fsS -X POST http://127.0.0.1:18800/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H "mcp-session-id: $SID" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"delete-invoice","arguments":{"id":"CI"}}}' \
            | grep -q 'Blocked:' || { echo "write guard did NOT block delete-invoice"; exit 1; }
          echo "smoke ok: streamable-http up, write guard armed"
          podman rm -f smoke

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          for t in $TAGS; do
            echo "pushing $t"
            podman push "$t"
          done
        env:
          TAGS: ${{ steps.tags.outputs.list }}
