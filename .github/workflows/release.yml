name: Release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/invoice-ninja-mcp

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Falls back to the default token when the secret is absent, so this
          # works unchanged today. Supplying RELEASE_PLEASE_TOKEN is the
          # documented upgrade: it makes release PRs authored by a real account
          # instead of github-actions[bot], which (a) stops GitHub gating their
          # CI runs on approval -- the bot has no write access, so it is treated
          # like an outside contributor -- and (b) lets the release/tag events
          # actually trigger other workflows, since events caused by
          # GITHUB_TOKEN are suppressed. The publish job below does not depend on
          # either, because it reads tags from git in the same run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Publishes an image for EVERY git release tag that does not have one yet, so
  # the package tags can never drift from the git tags again.
  #
  # Why this lives here rather than in publish.yml: release-please creates the
  # release and its tag with GITHUB_TOKEN, and GitHub suppresses workflow runs
  # for events caused by that token. So neither `on: release` nor
  # `on: push: tags` can ever fire for a release-please release — that is why
  # v0.1.0 and v0.1.1 shipped with no image tags at all. Running the publish as
  # a dependent job of the same workflow means no event has to propagate: the
  # release already exists by the time this job starts, and it is read from git
  # directly rather than from an event payload.
  #
  # It reconciles rather than only handling the newest release, so it repairs
  # the two tags that predate this job on its first run.
  publish-images:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag is needed: this job builds from tags, not from HEAD.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Publish a release image for every tag missing one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAME"
          origin_ref="$GITHUB_SHA"

          # Anonymous pull token: the package is public, and using one here keeps
          # the existence check independent of our own push credentials.
          pull_token() {
            curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull" \
              | jq -r .token
          }
          has_image() {
            local tag="$1" tok
            tok=$(pull_token)
            curl -fsS -o /dev/null \
              -H "Authorization: Bearer $tok" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${tag}"
          }

          # Descending semver, so the first entry is the newest release and the
          # one :latest must point at.
          mapfile -t tags < <(git tag -l 'v*' --sort=-v:refname)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "no release tags yet; nothing to publish"
            exit 0
          fi
          newest="${tags[0]}"
          echo "newest release tag: $newest"

          for tag in "${tags[@]}"; do
            if has_image "$tag" 2>/dev/null; then
              echo "$tag: image already published"
              continue
            fi

            echo "::group::publishing $tag"
            # Build from the tag itself, with that tag's own Containerfile, so
            # the image corresponds to the source that version shipped.
            git checkout -f "$tag"
            pnpm install --frozen-lockfile
            pnpm run build
            podman build --platform linux/amd64 -f Containerfile \
              -t "$IMAGE:$tag" -t "$IMAGE:${tag#v}" .
            podman push "$IMAGE:$tag"
            podman push "$IMAGE:${tag#v}"
            echo "::endgroup::"
          done

          # :latest tracks the highest release, not whatever was built last.
          podman pull "$IMAGE:$newest"
          podman tag "$IMAGE:$newest" "$IMAGE:latest"
          podman push "$IMAGE:latest"
          echo "latest -> $newest"

          # Leave the checkout where it started.
          git checkout -f "$origin_ref"

      - name: Verify git tags and package tags agree
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAME"
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull" | jq -r .token)
          failed=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            if curl -fsS -o /dev/null -H "Authorization: Bearer $tok" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${tag}"; then
              echo "OK   $tag -> $IMAGE:$tag"
            else
              echo "MISS $tag has no image tag"
              failed=1
            fi
          done < <(git tag -l 'v*' --sort=-v:refname)
          if [ "$failed" -ne 0 ]; then
            echo "::error::a git release tag has no matching image tag"
            exit 1
          fi
